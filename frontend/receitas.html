<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Receitas | Finance Tracker</title>
</head>
<body>
    <header>
        <h1>Finance Tracker</h1>
        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="categorias.html">Categorias</a>
            <a href="receitas.html">Receitas</a>
            <a href="despesas.html">Despesas</a>
        </nav>
    </header>
    <main>
        <section>
            <h1>Receitas</h1>
            <div class="card">
                <h2>Nova Receita</h2>
                <label for="usuario_receita">Usuário</label>
                <select id="usuario_receita"></select>
                <label for="descricao_receita">Descrição:</label>
                <input type="text" id="descricao_receita">
                <label for="valor_receita">Valor:</label>
                <input type="number" id="valor_receita">
                <label for="data_receita">Data:</label>
                <input type="date" id="data_receita">
                <label for="categoria_receita">Categoria:</label>
                <select name="categorias" id="categoria_receita"></select>
                <button id="button_salvar_receita">Salvar</button>
            </div>
            <h2>Receitas Cadastradas</h2>
            <table>
                <thead>
                    <tr>
                        <th>Descrição</th>
                        <th>Valor</th>
                        <th>Data</th>
                        <th>Categoria</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="minha_lista_receita">
                    <tr>
                        <td>Nenhuma receita cadastrada</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>
<script src="js/api.js"></script>
<script src="js/receitas.js"></script>
</body>
</html>
