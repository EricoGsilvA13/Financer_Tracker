<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Despesas | Finance Tracker</title>
</head>
<body>
    <header>
        <h1>Finance Tracker</h1>
        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="categorias.html">Categorias</a>
            <a href="receitas.html">Receitas</a>
            <a href="despesas.html">Despesas</a>
        </nav>
    </header>
    <main>
        <section>
            <h1>Despesas</h1>
            <div class="card">
                <h2>Nova Despesa</h2>
                <label for="usuario_despesa">Usuário</label>
                <select id="usuario_despesa"></select>
                <label for="descricao_despesa">Descrição:</label>
                <input type="text" id="descricao_despesa">
                <label for="valor_despesa">Valor:</label>
                <input type="number" id="valor_despesa">
                <label for="data_despesa">Data:</label>
                <input type="date" id="data_despesa">
                <label for="categoria_despesa">Categoria:</label>
                <select name="categorias" id="categoria_despesa"></select>
                <button id="button_salvar_despesa">Salvar</button>
            </div>
            <h2>Despesas cadastradas</h2>
            <table>
                <thead>
                    <tr>
                        <th>Descrição</th>
                        <th>Valor</th>
                        <th>Data</th>
                    <th>Categoria</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="minha_lista_despesa">
                <tr>
                    <td>Nenhuma despesa cadastrada</td>
                </tr>
            </tbody>
        </table>
    </section>
</main>
<script src="js/api.js"></script>
<script src="js/despesas.js"></script>
</body>
</html>
